version: '3.8'

services:
  # Servicio de lógica de aplicación (Node.js)
  app-logic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=mongodb://mongodb:27017/pedidos
    networks:
      - internal-network
    # NO exponer puertos al host (diferencia clave con ports)
    expose:
      - "3001"
    depends_on:
      - mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Base de datos MongoDB
  mongodb:
    image: mongo:6
    container_name: mongodb
    networks:
      - internal-network
    expose:
      - "27017"
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Servidor web Nginx (proxy inverso)
  web-server:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - internal-network
    depends_on:
      - app-logic
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  internal-network:
    driver: bridge
    name: backend-network

volumes:
  mongodb-data:
    name: mongodb-data